version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentpulse_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: TalentPulseATS
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8002
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: talentpulse_db
      DB_USERNAME: talentpulse_user
      DB_PASSWORD: talentpulse_password
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
    networks:
      - talentpulse_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentpulse_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8002/api/v1
    depends_on:
      - backend
    networks:
      - talentpulse_network

  postgres:
    image: postgres:16-alpine
    container_name: talentpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentpulse_db
      POSTGRES_USER: talentpulse_user
      POSTGRES_PASSWORD: talentpulse_password
    ports:
      - "5433:5432"
    volumes:
      - talentpulse_pgdata:/var/lib/postgresql/data
      - ./backend/database/init_talentpulse.sql:/docker-entrypoint-initdb.d/init_talentpulse.sql
    networks:
      - talentpulse_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: talentpulse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@platform.bj
      PGADMIN_DEFAULT_PASSWORD: Christophe
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5052:80"
    depends_on:
      - postgres
    networks:
      - talentpulse_network

networks:
  talentpulse_network:
    driver: bridge

volumes:
  talentpulse_pgdata:
